version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shorts-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-shorts_history}
      - POSTGRES_USER=${POSTGRES_USER:-shorts_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shorts_user} -d ${POSTGRES_DB:-shorts_history}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: shorts-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"
    ports:
      - "5679:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-shorts_history}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-shorts_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=Europe/Madrid
    volumes:
      - ./data:/data

  render-worker:
    image: python:3-alpine
    container_name: shorts-render-worker
    working_dir: ${PROJECT_ROOT}
    volumes:
      - ${PROJECT_ROOT}:${PROJECT_ROOT}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - PROJECT_HOST_PATH=${PROJECT_ROOT}
    command: sh -c "apk add --no-cache docker-cli && python render_server.py"
    ports:
      - "8580:8580"
    restart: unless-stopped
