version: "3.8"

services:
  app:
    build: .
    image: shorts-creator:slice4
    container_name: shorts-creator-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent storage for generated videos (job artifacts).
      # Bind mount keeps job files visible on the host at ./data/videos.
      - ./data/videos:/app/data/videos:cached
    environment:
      # Environment-driven configuration (no baked-in secrets).
      - NODE_ENV=production
      # Production frontend build root (canonical in-image path).
      - SHORTS_FRONTEND_DIST=/app/dist/frontend/browser